name: Save GitHub Traffic

on:
  schedule:
    # Run every day at 03:17 UTC
    - cron: "17 3 * * *"

  # Allow manual execution from the Actions page
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GitHub traffic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p traffic

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPO}/traffic/views?per=day" \
            > /tmp/views.json

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPO}/traffic/clones?per=day" \
            > /tmp/clones.json

      - name: Update traffic CSV
        run: |
          python3 <<'PY'
          import csv
          import json
          import os

          output = "traffic/github-traffic.csv"

          with open("/tmp/views.json", encoding="utf-8") as f:
              views = json.load(f)["views"]

          with open("/tmp/clones.json", encoding="utf-8") as f:
              clones = json.load(f)["clones"]

          data = {}

          # Load existing historical data
          if os.path.exists(output):
              with open(output, newline="", encoding="utf-8") as f:
                  reader = csv.DictReader(f)

                  for row in reader:
                      data[row["date"]] = row

          # Merge the latest view statistics
          for item in views:
              date = item["timestamp"][:10]

              if date not in data:
                  data[date] = {
                      "date": date,
                      "views": "0",
                      "unique_visitors": "0",
                      "clones": "0",
                      "unique_cloners": "0",
                  }

              data[date]["views"] = str(item["count"])
              data[date]["unique_visitors"] = str(item["uniques"])

          # Merge the latest clone statistics
          for item in clones:
              date = item["timestamp"][:10]

              if date not in data:
                  data[date] = {
                      "date": date,
                      "views": "0",
                      "unique_visitors": "0",
                      "clones": "0",
                      "unique_cloners": "0",
                  }

              data[date]["clones"] = str(item["count"])
              data[date]["unique_cloners"] = str(item["uniques"])

          fields = [
              "date",
              "views",
              "unique_visitors",
              "clones",
              "unique_cloners",
          ]

          with open(output, "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()

              for date in sorted(data):
                  writer.writerow(data[date])

          print(f"Stored {len(data)} days in {output}")
          PY

      - name: Commit traffic history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add traffic/github-traffic.csv

          if git diff --cached --quiet; then
            echo "No traffic changes"
            exit 0
          fi

          git commit -m "chore: update GitHub traffic statistics"
          git push
